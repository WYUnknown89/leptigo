name: Notify IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Tell search engines Leptigo changed
        run: |
          curl --fail-with-body --retry 3 --retry-delay 2 \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fleptigo.co.uk%2F&key=660424eb32ca2c4c87ec8af38f1a4036&keyLocation=https%3A%2F%2Fleptigo.co.uk%2F660424eb32ca2c4c87ec8af38f1a4036.txt"
